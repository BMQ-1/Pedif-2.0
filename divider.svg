<svg width="100%" height="4" viewBox="0 0 800 4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pedif-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4541" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1B4541" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#C87C56" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38B2AC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1B4541" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes glide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .beam {
        animation: glide 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
      }
      @media (prefers-color-scheme: dark) {
        .track { stroke: #2D3748; stroke-opacity: 0.4; }
      }
      @media (prefers-color-scheme: light) {
        .track { stroke: #E2E8F0; stroke-opacity: 0.8; }
      }
    </style>
  </defs>
  <line class="track" x1="0" y1="2" x2="800" y2="2" stroke-width="1"/>
  <g class="beam">
    <rect x="150" y="0.5" width="500" height="3" rx="1.5" fill="url(#pedif-glow)"/>
  </g>
</svg>